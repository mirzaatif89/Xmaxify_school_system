<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Management - Apex Group Of Schools</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260603-american-lyceum-brand">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .layout { display:grid; grid-template-columns:minmax(320px,0.8fr) minmax(420px,1.2fr); gap:1rem; align-items:start; }
        .card { background:#fff; border:1px solid var(--border-color); border-radius:14px; box-shadow:var(--shadow-sm); padding:1rem; }
        .field { display:grid; gap:.35rem; margin-bottom:.85rem; }
        .field label { font-size:.84rem; font-weight:800; color:var(--text-secondary); }
        .field input, .field textarea, .field select { width:100%; min-height:42px; border:1px solid var(--border-color); border-radius:10px; padding:.65rem .85rem; font:inherit; background:#fff; }
        .field textarea { min-height:88px; resize:vertical; }
        .actions { display:flex; gap:.65rem; flex-wrap:wrap; }
        .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.85rem; margin-bottom:1rem; }
        .summary-card { border:1px solid #dfe7ef; border-radius:14px; background:linear-gradient(180deg,#fff 0%,#f7fbfd 100%); padding:.95rem; box-shadow:var(--shadow-sm); }
        .summary-card span { display:block; font-size:.78rem; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; }
        .summary-card strong { display:block; margin-top:.35rem; font-size:1.4rem; }
        .list { display:grid; gap:.75rem; }
        .item { border:1px solid #e2e8f0; border-radius:12px; background:#fff; padding:.85rem; display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
        .item small { color:var(--text-secondary); display:block; margin-top:.2rem; }
        .status { display:inline-flex; padding:.22rem .55rem; border-radius:999px; background:#dcfce7; color:#166534; font-size:.75rem; font-weight:800; }
        .status.past { background:#e2e8f0; color:#475569; }
        .status.future { background:#e0f2fe; color:#075985; }
        @media (max-width: 920px) { .layout, .summary-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Apex Group Of Schools logo"></div>
        <nav class="nav-links"></nav>
        <a href="settings.html" class="user-profile"><div class="avatar">AD</div><div class="user-info"><h4>Admin User</h4><p>Principal</p></div></a>
    </aside>
    <main class="main-content">
        <header class="header">
            <div>
                <h1>Create Session</h1>
                <p style="color:var(--text-secondary); margin-top:.25rem;">Manage academic sessions and keep a simple session history.</p>
            </div>
        </header>

        <section class="summary-grid">
            <article class="summary-card"><span>Total Sessions</span><strong id="sessionCount">0</strong></article>
            <article class="summary-card"><span>Current Session</span><strong id="currentSessionLabel">-</strong></article>
            <article class="summary-card"><span>Upcoming</span><strong id="upcomingSessionCount">0</strong></article>
            <article class="summary-card"><span>Status</span><strong id="sessionStatus">Ready</strong></article>
        </section>

        <section class="layout">
            <article class="card">
                <h2>Session Form</h2>
                <input type="hidden" id="sessionId">
                <div class="field"><label for="sessionName">Session Name</label><input id="sessionName" placeholder="2026-2027"></div>
                <div class="field"><label for="sessionStart">Start Date</label><input id="sessionStart" type="date"></div>
                <div class="field"><label for="sessionEnd">End Date</label><input id="sessionEnd" type="date"></div>
                <div class="field"><label for="sessionNotes">Notes</label><textarea id="sessionNotes" placeholder="Optional session notes"></textarea></div>
                <label style="display:flex;align-items:center;gap:.5rem;margin-bottom:.85rem;"><input id="sessionCurrent" type="checkbox" checked> Mark as current session</label>
                <div class="actions">
                    <button class="btn btn-outline" type="button" id="clearSessionBtn"><i data-lucide="refresh-cw"></i> Clear</button>
                    <button class="btn btn-primary" type="button" id="saveSessionBtn"><i data-lucide="save"></i> Save Session</button>
                </div>
            </article>
            <article class="card">
                <h2>Session History</h2>
                <div class="list" id="sessionList"></div>
            </article>
        </section>
    </main>
</div>
<script src="auth.js?v=20260801-session-management"></script>
<script src="script.js?v=20260801-session-management"></script>
<script>
const KEY = 'eduCore_academic_sessions';
function read(){ try { return Array.isArray(JSON.parse(localStorage.getItem(KEY)||'[]')) ? JSON.parse(localStorage.getItem(KEY)||'[]') : []; } catch { return []; } }
function write(data){ localStorage.setItem(KEY, JSON.stringify(data)); }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function getToday(){ return new Date().toISOString().slice(0,10); }
function render() {
    const sessions = read().sort((a,b) => String(b.startDate||b.createdAt||'').localeCompare(String(a.startDate||a.createdAt||'')));
    const current = sessions.find((item) => item.isCurrent) || sessions[0] || null;
    document.getElementById('sessionCount').textContent = String(sessions.length);
    document.getElementById('currentSessionLabel').textContent = current?.name || '-';
    document.getElementById('upcomingSessionCount').textContent = String(sessions.filter((item) => !item.isCurrent && String(item.startDate || '') > getToday()).length);
    document.getElementById('sessionList').innerHTML = sessions.length ? sessions.map((item) => `
        <div class="item">
            <div>
                <strong>${esc(item.name || '-')}</strong>
                <small>${esc(item.startDate || '-')} to ${esc(item.endDate || '-')}</small>
                <small>${esc(item.notes || '')}</small>
            </div>
            <div style="display:grid;gap:.45rem;justify-items:end;">
                <span class="status ${item.isCurrent ? '' : (String(item.endDate || '') < getToday() ? 'past' : 'future')}">${item.isCurrent ? 'Current' : (String(item.endDate || '') < getToday() ? 'Past' : 'Upcoming')}</span>
                <div style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;">
                    <button class="btn btn-outline" type="button" onclick="editSession('${esc(item.id)}')">Edit</button>
                    <button class="btn btn-outline" type="button" onclick="deleteSession('${esc(item.id)}')">Delete</button>
                </div>
            </div>
        </div>
    `).join('') : '<div class="empty-state">No sessions added yet.</div>';
    document.getElementById('sessionStatus').textContent = `${sessions.length} loaded`;
    if (window.lucide) window.lucide.createIcons();
}
function clearForm() {
    document.getElementById('sessionId').value = '';
    document.getElementById('sessionName').value = '';
    document.getElementById('sessionStart').value = '';
    document.getElementById('sessionEnd').value = '';
    document.getElementById('sessionNotes').value = '';
    document.getElementById('sessionCurrent').checked = true;
}
function editSession(id) {
    const session = read().find((item) => String(item.id) === String(id));
    if (!session) return;
    document.getElementById('sessionId').value = session.id || '';
    document.getElementById('sessionName').value = session.name || '';
    document.getElementById('sessionStart').value = session.startDate || '';
    document.getElementById('sessionEnd').value = session.endDate || '';
    document.getElementById('sessionNotes').value = session.notes || '';
    document.getElementById('sessionCurrent').checked = session.isCurrent !== false;
}
function saveSession() {
    const sessions = read();
    const id = document.getElementById('sessionId').value || `SES-${Date.now()}`;
    const payload = {
        id,
        name: document.getElementById('sessionName').value.trim(),
        startDate: document.getElementById('sessionStart').value,
        endDate: document.getElementById('sessionEnd').value,
        notes: document.getElementById('sessionNotes').value.trim(),
        isCurrent: document.getElementById('sessionCurrent').checked,
        createdAt: sessions.find((item) => String(item.id) === String(id))?.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };
    if (!payload.name || !payload.startDate || !payload.endDate) {
        alert('Session name, start date, and end date are required.');
        return;
    }
    const next = sessions.filter((item) => String(item.id) !== String(id));
    if (payload.isCurrent) next.forEach((item) => { item.isCurrent = false; });
    next.unshift(payload);
    write(next);
    document.getElementById('sessionStatus').textContent = 'Session saved successfully.';
    clearForm();
    render();
}
function deleteSession(id) {
    if (!confirm('Delete this session?')) return;
    write(read().filter((item) => String(item.id) !== String(id)));
    render();
}
document.getElementById('saveSessionBtn').addEventListener('click', saveSession);
document.getElementById('clearSessionBtn').addEventListener('click', clearForm);
render();
if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
