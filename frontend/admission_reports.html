<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Reports - Apex Group Of Schools</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260603-american-lyceum-brand">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .toolbar { display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end; margin-bottom:1rem; }
        .field { display:grid; gap:.35rem; }
        .field label { font-size:.82rem; font-weight:800; color:var(--text-secondary); }
        .field input, .field select { min-height:42px; min-width:180px; border:1px solid var(--border-color); border-radius:10px; padding:.65rem .85rem; background:#fff; font:inherit; }
        .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.85rem; margin-bottom:1rem; }
        .summary-card { border:1px solid #dfe7ef; border-radius:14px; background:linear-gradient(180deg,#fff 0%,#f7fbfd 100%); padding:.95rem; box-shadow:var(--shadow-sm); }
        .summary-card span { display:block; font-size:.78rem; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; }
        .summary-card strong { display:block; margin-top:.35rem; font-size:1.35rem; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; min-width:1100px; border-collapse:collapse; }
        th, td { padding:.72rem .7rem; border-bottom:1px solid #e5ecf3; text-align:left; vertical-align:top; }
        th { font-size:.8rem; text-transform:uppercase; color:var(--text-secondary); background:#f8fafc; }
        .actions { display:flex; gap:.65rem; flex-wrap:wrap; }
        @media (max-width: 920px) { .summary-grid { grid-template-columns:1fr; } .toolbar { align-items:stretch; } .field input, .field select { min-width:0; width:100%; } }
    </style>
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Apex Group Of Schools logo"></div>
        <nav class="nav-links"></nav>
        <a href="settings.html" class="user-profile"><div class="avatar">AD</div><div class="user-info"><h4>Admin User</h4><p>Principal</p></div></a>
    </aside>
    <main class="main-content">
        <header class="header">
            <div>
                <h1>Admission Reports</h1>
                <p style="color:var(--text-secondary); margin-top:.25rem;">Filter online admissions and export PDF, Excel, or print-ready reports.</p>
            </div>
        </header>
        <section class="summary-grid">
            <article class="summary-card"><span>Total</span><strong id="reportTotal">0</strong></article>
            <article class="summary-card"><span>New</span><strong id="reportNew">0</strong></article>
            <article class="summary-card"><span>Contacted</span><strong id="reportContacted">0</strong></article>
            <article class="summary-card"><span>Closed</span><strong id="reportClosed">0</strong></article>
        </section>

        <section class="toolbar">
            <div class="field"><label for="reportCampus">Campus</label><input id="reportCampus" placeholder="All Campuses"></div>
            <div class="field"><label for="reportStatus">Status</label><select id="reportStatus"><option value="all">All</option><option value="New">New</option><option value="Contacted">Contacted</option><option value="Closed">Closed</option></select></div>
            <div class="field"><label for="reportFrom">From</label><input id="reportFrom" type="date"></div>
            <div class="field"><label for="reportTo">To</label><input id="reportTo" type="date"></div>
            <div class="actions">
                <button class="btn btn-outline" type="button" id="printReportBtn"><i data-lucide="printer"></i> Print</button>
                <button class="btn btn-outline" type="button" id="exportExcelBtn"><i data-lucide="file-spreadsheet"></i> Excel</button>
                <button class="btn btn-outline" type="button" id="exportCsvBtn"><i data-lucide="file-text"></i> CSV</button>
            </div>
        </section>

        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Student</th><th>Parent</th><th>Class</th><th>Campus</th><th>Phone</th><th>Email</th><th>Status</th><th>Message</th></tr>
                    </thead>
                    <tbody id="reportRows"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="auth.js?v=20260801-admission-reports"></script>
<script src="script.js?v=20260801-admission-reports"></script>
<script>
let reportData = [];
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function loadReports() {
    fetch(`${API_BASE_URL}/online-admissions`)
        .then((res) => res.json())
        .then((data) => {
            reportData = Array.isArray(data.applications) ? data.applications : [];
            render();
        })
        .catch(() => {
            reportData = [];
            render();
        });
}
function getFiltered() {
    const status = document.getElementById('reportStatus').value;
    const campus = document.getElementById('reportCampus').value.trim().toLowerCase();
    const from = document.getElementById('reportFrom').value;
    const to = document.getElementById('reportTo').value;
    return reportData.filter((item) => {
        const date = String(item.createdAt || '').slice(0,10);
        const matchStatus = status === 'all' || String(item.status || 'New') === status;
        const matchCampus = !campus || String(item.campus || '').toLowerCase().includes(campus);
        const matchFrom = !from || date >= from;
        const matchTo = !to || date <= to;
        return matchStatus && matchCampus && matchFrom && matchTo;
    });
}
function render() {
    const rows = getFiltered().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    document.getElementById('reportTotal').textContent = String(reportData.length);
    document.getElementById('reportNew').textContent = String(reportData.filter((item) => String(item.status || 'New') === 'New').length);
    document.getElementById('reportContacted').textContent = String(reportData.filter((item) => String(item.status || '') === 'Contacted').length);
    document.getElementById('reportClosed').textContent = String(reportData.filter((item) => String(item.status || '') === 'Closed').length);
    document.getElementById('reportRows').innerHTML = rows.length ? rows.map((item) => `
        <tr>
            <td>${esc(String(item.createdAt || '').slice(0,10) || '-')}</td>
            <td><strong>${esc(item.studentName || '-')}</strong></td>
            <td>${esc(item.parentName || '-')}</td>
            <td>${esc(item.className || '-')}</td>
            <td>${esc(item.campus || '-')}</td>
            <td>${esc(item.phone || '-')}</td>
            <td>${esc(item.email || '-')}</td>
            <td>${esc(item.status || 'New')}</td>
            <td>${esc(item.message || '-')}</td>
        </tr>
    `).join('') : '<tr><td colspan="9">No admission records found.</td></tr>';
    if (window.lucide) window.lucide.createIcons();
}
function toCsv(rows){
    const headers = ['createdAt','studentName','parentName','className','campus','phone','email','status','message'];
    return [headers.join(','), ...rows.map((row) => headers.map((key) => `"${String(row[key] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
}
function exportCsv(){
    const csv = toCsv(getFiltered());
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'admission-report.csv';
    a.click();
    URL.revokeObjectURL(a.href);
}
function exportExcel(){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(getFiltered()), 'Admissions');
    XLSX.writeFile(wb, 'admission-report.xlsx');
}
function printReport(){
    const rows = getFiltered();
    const win = window.open('', '_blank', 'width=1200,height=800');
    win.document.write(`<html><head><title>Admission Report</title><style>body{font-family:Arial,sans-serif;padding:24px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f4f7f9;}</style></head><body><h1>Admission Report</h1><table><thead><tr><th>Date</th><th>Student</th><th>Parent</th><th>Class</th><th>Campus</th><th>Phone</th><th>Email</th><th>Status</th></tr></thead><tbody>${rows.map((item)=>`<tr><td>${esc(String(item.createdAt || '').slice(0,10) || '-')}</td><td>${esc(item.studentName || '-')}</td><td>${esc(item.parentName || '-')}</td><td>${esc(item.className || '-')}</td><td>${esc(item.campus || '-')}</td><td>${esc(item.phone || '-')}</td><td>${esc(item.email || '-')}</td><td>${esc(item.status || 'New')}</td></tr>`).join('')}</tbody></table></body></html>`);
    win.document.close();
    win.print();
}
document.getElementById('reportCampus').addEventListener('input', render);
document.getElementById('reportStatus').addEventListener('change', render);
document.getElementById('reportFrom').addEventListener('change', render);
document.getElementById('reportTo').addEventListener('change', render);
document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
document.getElementById('printReportBtn').addEventListener('click', printReport);
loadReports();
</script>
</body>
</html>
